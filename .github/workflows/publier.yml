# Codex DCG — récupère le programme de la semaine dans Notion et publie le site.
# Réglages nécessaires (une seule fois) :
#   1. Secret du dépôt NOTION_TOKEN = clé de l'intégration Notion (lecture seule).
#   2. L'intégration est connectée à la page Notion « Codex DCG – fichier de la semaine ».
#   3. Settings → Pages → Source : « GitHub Actions ».
name: Publier le site

on:
  push:
    branches: [main, master]
  schedule:
    # Dimanche soir et lundi matin (heures UTC) : après la tâche « Préparation de la semaine DCG ».
    - cron: "30 19 * * 0"
    - cron: "30 21 * * 0"
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NOTION_PAGE_ID: 3fc537c42d4b810c8cf5d68f00bb6586

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le fichier de la semaine dans Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then echo "Pas de secret NOTION_TOKEN : étape ignorée."; exit 0; fi
          python3 .github/recuperer_semaine.py

      - name: Enregistrer dans le dépôt
        run: |
          if [ -n "$(git status --porcelain semaines)" ]; then
            git config user.name "codex-dcg-robot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add semaines
            git commit -m "Programme de la semaine (automatique)"
            git push
          else
            echo "Rien de nouveau."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
